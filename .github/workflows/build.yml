name: Build

# Deployment builds on pushes to main; this catches a broken build on the pull request instead, before it
# can reach main and fail the deploy.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs vue-tsc and then Vite, so this covers the type-check as well as the build.
      - name: Build
        run: npm run build

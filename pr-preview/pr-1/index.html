<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />

    <title>SelfAwareGrid &mdash; positional awareness for CSS grid</title>
    <meta
      name="description"
      content="Powerful enhancements to CSS grid, with a simple API enabling more intelligent functionality and more responsive styling"
    />

    <link rel="icon" type="image/svg+xml" href="/SelfAwareGrid-Demo/pr-preview/pr-1/favicon.svg" />

      href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&family=Idiqlat:wght@200;400&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * Applied before first paint so the page never flashes the wrong theme.
       * The toggle in the header writes to the same storage key.
       */
      (function () {
          try {
              var stored = localStorage.getItem('sag-demo-theme');
              var dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
              document.documentElement.classList.toggle('dark', dark);
              document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          } catch (error) {
              document.documentElement.classList.add('dark');
          }
      })();
    </script>
